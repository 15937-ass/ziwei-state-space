collection_stats:
  source_count: 3
  indexed_case_count: 100
  pilot_case_count: 20
  full_extraction_complete: 0

observed_structure:
  - "case question"
  - "reply/conclusion"
  - "natal chart explanation"
  - "decade/year chart explanation in many cases"
  - "questioner feedback in some cases"

corpus_role:
  - "expert_reasoning_demonstration"
  - "temporal_reasoning_training"
  - "rule-linking_validation"
  - "case-based regression"

ingestion_policy:
  extract_case_level_records: true
  preserve_page_provenance: true
  preserve_author_text_span_refs: true
  rebuild_chart_deterministically: true
  link_to_canonical_rule_ids: true
  allow_case_derived_rule_candidates: true
  auto_promote_case_rule_to_canonical: false
  allow_blind_accuracy_claim_from_author_conclusion: false

split_policy:
  unit: "person_group_id"
  train: 0.70
  development: 0.15
  heldout_casebook_test: 0.15
  external_benchmark_isolated: true

artifacts:
  case_index: "training_data/CASEBOOK_CASE_INDEX_v0.1.csv"
  pilot20: "training_data/CASEBOOK_PILOT20_v0.1.csv"
  ingestion_plan: "product/CASEBOOK_INGESTION_PLAN_v0.1.md"
  record_schema: "training_data/CASE_EVIDENCE_SCHEMA_v0.1.md"

next:
