name: manual-phase-closure-audit
run-name: Phase closure audit — ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'push ignored' }}

# Keep this audit manually invokable. The all-paths push exclusion is an explicit
# guard against the repository's observed empty, failed push-event runs.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Phase/closure identifier"
        required: true
        type: string
  push:
    paths-ignore:
      - "**"

permissions:
  contents: read

jobs:
  closure-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest
      - name: Full tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Repository P0 audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/audit_repository.py --fail-on-p0
      - name: Governance static audit
        run: python tools/validate_governance.py --allow-main
      - name: Record requested closure scope
        env:
          CLOSURE_SCOPE: ${{ inputs.scope }}
        run: echo "Closure scope: $CLOSURE_SCOPE"
