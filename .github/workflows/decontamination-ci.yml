name: repository-quality-gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: repository-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Check product JS adapters
        run: |
          if [ -f tools/iztro_export.mjs ]; then node --check tools/iztro_export.mjs; fi

      - name: Enforce deterministic P0 repository gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/audit_repository.py --fail-on-p0

      - name: Enforce Repository Governance v1
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/validate_governance.py \
              --base-ref "origin/${{ github.base_ref }}" \
              --head-branch "${{ github.head_ref }}"
          else
            python tools/validate_governance.py --allow-main
          fi
