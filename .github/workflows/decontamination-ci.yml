name: decontamination-ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "knowledge/**"
      - "validation/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/decontamination-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "knowledge/**"
      - "validation/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/decontamination-ci.yml"

concurrency:
  group: decontamination-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Check product JS adapters
        run: |
          if [ -f tools/iztro_export.mjs ]; then node --check tools/iztro_export.mjs; fi

      - name: Enforce deterministic P0 gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/audit_repository.py --fail-on-p0
