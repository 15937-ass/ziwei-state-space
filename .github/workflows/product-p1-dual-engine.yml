name: product-p1-dual-engine

# G8: public-repository standard runners are enabled for Product regression validation.
# No push trigger is allowed; workflow_dispatch remains a manual fallback.
on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/chart_inputs_to_jsonl.py"
      - "tools/iztro_full_export.mjs"
      - "tools/x_iztro_full_export.py"
      - "tools/p1_compare_full.py"
      - "tools/p1_independent_compare.py"
      - "tools/dawang_p1_export/**"
      - "validation/product_chart_regression/regression_inputs_v0.1.csv"
      - "validation/product_chart_regression/temporal_targets_v0.2.json"
      - "product/CANONICAL_CHART_CONTRACT_v1.0.md"
      - ".github/workflows/product-p1-dual-engine.yml"
  workflow_dispatch:

concurrency:
  group: product-p1-dual-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p1-dual-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build 100-case adapter input
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/chart_inputs_to_jsonl.py \
            validation/product_chart_regression/regression_inputs_v0.1.csv \
            /tmp/p1_inputs.jsonl
          test "$(wc -l < /tmp/p1_inputs.jsonl)" -eq 100

      - name: Install pinned engines
        run: |
          npm install --no-save iztro@2.6.1
          python -m pip install --upgrade "x-iztro==0.6.1"

      - name: Export iztro JS full snapshots
        env:
          IZTRO_VERSION: "2.6.1"
        run: |
          node tools/iztro_full_export.mjs \
            /tmp/p1_inputs.jsonl \
            validation/product_chart_regression/temporal_targets_v0.2.json \
            /tmp/p1_iztro_js.jsonl

      - name: Export x-iztro Rust full snapshots
        run: |
          python tools/x_iztro_full_export.py \
            /tmp/p1_inputs.jsonl \
            validation/product_chart_regression/temporal_targets_v0.2.json \
            /tmp/p1_xiztro_rust.jsonl

      - name: Compare 100 natal + 400 full horoscope snapshots
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/p1_compare_full.py \
            /tmp/p1_iztro_js.jsonl \
            /tmp/p1_xiztro_rust.jsonl \
            --report /tmp/p1_dual_engine_report.json \
            --fail-on-diff
          cat /tmp/p1_dual_engine_report.json | head -80

      - name: Export pinned independent Go engine
        run: |
          git clone --quiet https://github.com/dawang20250107/ziweidoushu.git /tmp/dawang
          cd /tmp/dawang
          git checkout --quiet 947166fc45cd7c8c0849da1bd870f570972a7172
          mkdir -p cmd/p1export
          cp "$GITHUB_WORKSPACE/tools/dawang_p1_export/main.go" cmd/p1export/main.go
          go run ./cmd/p1export \
            /tmp/p1_inputs.jsonl \
            "$GITHUB_WORKSPACE/validation/product_chart_regression/temporal_targets_v0.2.json" \
            /tmp/p1_dawang_go.jsonl

      - name: Independent Go core audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/p1_independent_compare.py \
            /tmp/p1_iztro_js.jsonl \
            /tmp/p1_dawang_go.jsonl \
            --report /tmp/p1_independent_go_report.json \
            --fail-on-core-diff
          cat /tmp/p1_independent_go_report.json | head -100

      - name: Upload P1 differential artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-dual-engine-full-${{ github.sha }}
          path: |
            /tmp/p1_iztro_js.jsonl
            /tmp/p1_xiztro_rust.jsonl
            /tmp/p1_dual_engine_report.json
            /tmp/p1_dawang_go.jsonl
            /tmp/p1_independent_go_report.json
          retention-days: 30
