name: product-p1-dual-engine

on:
  pull_request:
  push:
    branches:
      - main
      - "product/**"

permissions:
  contents: read

jobs:
  p1-dual-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build 100-case adapter input
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/chart_inputs_to_jsonl.py \
            validation/product_chart_regression/regression_inputs_v0.1.csv \
            /tmp/p1_inputs.jsonl
          test "$(wc -l < /tmp/p1_inputs.jsonl)" -eq 100

      - name: Install pinned engines
        run: |
          npm install --no-save iztro@2.6.1
          python -m pip install --upgrade "x-iztro==0.6.1"

      - name: Export iztro JS full snapshots
        env:
          IZTRO_VERSION: "2.6.1"
        run: |
          node tools/iztro_full_export.mjs \
            /tmp/p1_inputs.jsonl \
            validation/product_chart_regression/temporal_targets_v0.2.json \
            /tmp/p1_iztro_js.jsonl

      - name: Export x-iztro Rust full snapshots
        run: |
          python tools/x_iztro_full_export.py \
            /tmp/p1_inputs.jsonl \
            validation/product_chart_regression/temporal_targets_v0.2.json \
            /tmp/p1_xiztro_rust.jsonl

      - name: Compare 100 natal + 400 full horoscope snapshots
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/p1_compare_full.py \
            /tmp/p1_iztro_js.jsonl \
            /tmp/p1_xiztro_rust.jsonl \
            --report /tmp/p1_dual_engine_report.json \
            --fail-on-diff
          cat /tmp/p1_dual_engine_report.json | head -80

      - name: Upload P1 differential artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-dual-engine-full-${{ github.sha }}
          path: |
            /tmp/p1_iztro_js.jsonl
            /tmp/p1_xiztro_rust.jsonl
            /tmp/p1_dual_engine_report.json
          retention-days: 30
