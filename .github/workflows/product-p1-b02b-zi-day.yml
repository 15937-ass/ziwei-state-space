name: product-p1-b02b-zi-day

# G8: public-repository standard runners are enabled for Product regression validation.
# No push trigger is allowed; workflow_dispatch remains a manual fallback.
on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/chart_inputs_to_jsonl.py"
      - "tools/iztro_full_export.mjs"
      - "tools/x_iztro_full_export.py"
      - "tools/p1_compare_full.py"
      - "tools/p1_independent_compare.py"
      - "tools/p1_validate_boundary_expectations.py"
      - "tools/p1_validate_zi_day_boundary.py"
      - "tools/dawang_p1_export/**"
      - "validation/product_chart_regression/regression_inputs_v0.1.csv"
      - "validation/product_chart_regression/b02b_zi_day_boundary.json"
      - "product/CANONICAL_CHART_CONTRACT_v1.0.md"
      - ".github/workflows/product-p1-b02b-zi-day.yml"
  workflow_dispatch:

concurrency:
  group: product-p1-b02b-zi-day-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  b02b-zi-day:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build bounded input and validate manifest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          timeout 60s python tools/chart_inputs_to_jsonl.py             validation/product_chart_regression/regression_inputs_v0.1.csv             /tmp/p1_inputs.jsonl
          test "$(wc -l < /tmp/p1_inputs.jsonl)" -eq 100
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          p=Path("validation/product_chart_regression/b02b_zi_day_boundary.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          n=len(m.get("targets", []))
          assert 1 <= n <= 8, f"target count out of guardrail: {n}"
          inputs=[json.loads(x) for x in Path("/tmp/p1_inputs.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          latest=max(date.fromisoformat(x["solar_date"]) for x in inputs)
          earliest=min(date.fromisoformat(x["solar_date"]) for x in m["targets"])
          assert earliest >= latest, f"target precedes natal seed: {earliest} < {latest}"
          assert m["config_contract"]["day_divide"] == "forward"
          print(f"targets={n} latest_birth={latest} earliest_target={earliest}")
          PY

      - name: Install pinned engines
        run: |
          timeout 300s npm install --no-save iztro@2.6.1
          timeout 300s python -m pip install --upgrade "x-iztro==0.6.1"

      - name: Export iztro JS
        env:
          IZTRO_VERSION: "2.6.1"
        run: |
          timeout 300s node tools/iztro_full_export.mjs             /tmp/p1_inputs.jsonl             validation/product_chart_regression/b02b_zi_day_boundary.json             /tmp/p1_iztro_b02b.jsonl

      - name: Export x-iztro Rust
        run: |
          timeout 300s python tools/x_iztro_full_export.py             /tmp/p1_inputs.jsonl             validation/product_chart_regression/b02b_zi_day_boundary.json             /tmp/p1_xiztro_b02b.jsonl

      - name: Validate civil lunar markers
        run: |
          timeout 120s python tools/p1_validate_boundary_expectations.py             /tmp/p1_iztro_b02b.jsonl             validation/product_chart_regression/b02b_zi_day_boundary.json             --max-errors 10 --max-targets 8

      - name: Profile late-Zi school-sensitive semantics
        run: |
          timeout 120s python tools/p1_validate_zi_day_boundary.py             /tmp/p1_iztro_b02b.jsonl             validation/product_chart_regression/b02b_zi_day_boundary.json             --report /tmp/p1_zi_day_semantics.json             --max-errors 10
          head -120 /tmp/p1_zi_day_semantics.json

      - name: Cross-implementation full diff
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          timeout 180s python tools/p1_compare_full.py             /tmp/p1_iztro_b02b.jsonl             /tmp/p1_xiztro_b02b.jsonl             --report /tmp/p1_dual_b02b_report.json             --max-total-diffs 500             --max-detail-per-case 100             --fail-on-diff
          head -80 /tmp/p1_dual_b02b_report.json

      - name: Export pinned independent Go engine
        run: |
          timeout 180s git clone --quiet https://github.com/dawang20250107/ziweidoushu.git /tmp/dawang
          cd /tmp/dawang
          git checkout --quiet 947166fc45cd7c8c0849da1bd870f570972a7172
          mkdir -p cmd/p1export
          cp "$GITHUB_WORKSPACE/tools/dawang_p1_export/main.go" cmd/p1export/main.go
          timeout 360s go run ./cmd/p1export             /tmp/p1_inputs.jsonl             "$GITHUB_WORKSPACE/validation/product_chart_regression/b02b_zi_day_boundary.json"             /tmp/p1_dawang_b02b.jsonl

      - name: Independent Go core audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          timeout 180s python tools/p1_independent_compare.py             /tmp/p1_iztro_b02b.jsonl             /tmp/p1_dawang_b02b.jsonl             --report /tmp/p1_independent_b02b_report.json             --school-sensitive-manifest validation/product_chart_regression/b02b_zi_day_boundary.json             --max-total-diffs 500             --max-detail-per-case 100             --fail-on-core-diff
          head -100 /tmp/p1_independent_b02b_report.json

      - name: Upload bounded B02-B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-b02b-zi-day-${{ github.sha }}
          path: |
            /tmp/p1_iztro_b02b.jsonl
            /tmp/p1_xiztro_b02b.jsonl
            /tmp/p1_zi_day_semantics.json
            /tmp/p1_dual_b02b_report.json
            /tmp/p1_dawang_b02b.jsonl
            /tmp/p1_independent_b02b_report.json
          retention-days: 30
