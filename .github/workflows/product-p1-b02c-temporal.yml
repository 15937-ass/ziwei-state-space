name: product-p1-b02c-temporal

# G8: public-repository standard runners are enabled for Product regression validation.
# No push trigger is allowed; workflow_dispatch remains a manual fallback.
on:
  pull_request:
    branches:
      - main
    paths:
      - "product/**"
      - "src/product/**"
      - "tools/**"
      - "validation/product_chart_regression/**"
      - ".github/workflows/product-p1-*.yml"
  workflow_dispatch:

concurrency:
  group: product-p1-b02c-temporal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  b02c-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: C1
            manifest: validation/product_chart_regression/b02c1_year_transitions_2027_2030.json
          - id: C2
            manifest: validation/product_chart_regression/b02c2_year_transitions_2031_2034.json
          - id: C3
            manifest: validation/product_chart_regression/b02c3_year_month_day_transitions.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build bounded input and validate manifest
        env:
          PYTHONPATH: ${{ github.workspace }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          timeout 60s python tools/chart_inputs_to_jsonl.py \
            validation/product_chart_regression/regression_inputs_v0.2.csv \
            /tmp/p1_inputs.jsonl
          test "$(wc -l < /tmp/p1_inputs.jsonl)" -eq 100
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          p=Path(os.environ["MANIFEST"])
          m=json.loads(p.read_text(encoding="utf-8"))
          targets=m.get("targets", [])
          pairs=m.get("transition_pairs", [])
          assert 1 <= len(targets) <= 8, f"target count out of guardrail: {len(targets)}"
          assert pairs, "transition_pairs required"
          ids={x["target_id"] for x in targets}
          for pair in pairs:
              assert pair["left"] in ids and pair["right"] in ids, pair
              assert pair["kind"] in {"YEAR","MONTH","DAY"}, pair
          inputs=[json.loads(x) for x in Path("/tmp/p1_inputs.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          latest=max(date.fromisoformat(x["solar_date"]) for x in inputs)
          earliest=min(date.fromisoformat(x["solar_date"]) for x in targets)
          assert earliest >= latest, f"target precedes natal seed: {earliest} < {latest}"
          assert all(int(x["time_index"]) == 6 for x in targets), "B02-C isolates temporal boundaries at daytime"
          print(f"batch={m.get('batch')} targets={len(targets)} pairs={len(pairs)} latest_birth={latest} earliest_target={earliest}")
          PY

      - name: Install pinned engines
        run: |
          timeout 300s npm install --no-save iztro@2.6.1
          timeout 300s python -m pip install --upgrade "x-iztro==0.6.1"

      - name: Export iztro JS
        env:
          IZTRO_VERSION: "2.6.1"
        run: |
          timeout 300s node tools/iztro_full_export.mjs \
            /tmp/p1_inputs.jsonl \
            ${{ matrix.manifest }} \
            /tmp/p1_iztro_b02c.jsonl

      - name: Export x-iztro Rust
        run: |
          timeout 300s python tools/x_iztro_full_export.py \
            /tmp/p1_inputs.jsonl \
            ${{ matrix.manifest }} \
            /tmp/p1_xiztro_b02c.jsonl

      - name: Profile transition semantics
        run: |
          timeout 120s python tools/p1_profile_temporal_transitions.py \
            /tmp/p1_iztro_b02c.jsonl \
            ${{ matrix.manifest }} \
            --report /tmp/p1_b02c_transition_report.json \
            --max-errors 10 \
            --assert-semantics
          head -160 /tmp/p1_b02c_transition_report.json

      - name: Cross-implementation full diff
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          timeout 180s python tools/p1_compare_full.py \
            /tmp/p1_iztro_b02c.jsonl \
            /tmp/p1_xiztro_b02c.jsonl \
            --report /tmp/p1_dual_b02c_report.json \
            --max-total-diffs 500 \
            --max-detail-per-case 100 \
            --fail-on-diff
          head -80 /tmp/p1_dual_b02c_report.json

      - name: Export pinned independent Go engine
        run: |
          timeout 180s git clone --quiet https://github.com/dawang20250107/ziweidoushu.git /tmp/dawang
          cd /tmp/dawang
          git checkout --quiet 947166fc45cd7c8c0849da1bd870f570972a7172
          mkdir -p cmd/p1export
          cp "$GITHUB_WORKSPACE/tools/dawang_p1_export/main.go" cmd/p1export/main.go
          timeout 360s go run ./cmd/p1export \
            /tmp/p1_inputs.jsonl \
            "$GITHUB_WORKSPACE/${{ matrix.manifest }}" \
            /tmp/p1_dawang_b02c.jsonl

      - name: Independent Go core audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          timeout 180s python tools/p1_independent_compare.py \
            /tmp/p1_iztro_b02c.jsonl \
            /tmp/p1_dawang_b02c.jsonl \
            --report /tmp/p1_independent_b02c_report.json \
            --max-total-diffs 500 \
            --max-detail-per-case 100 \
            --fail-on-core-diff
          head -100 /tmp/p1_independent_b02c_report.json

      - name: Upload bounded B02-C artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-b02c-${{ matrix.id }}-${{ github.sha }}
          path: |
            /tmp/p1_b02c_transition_report.json
            /tmp/p1_dual_b02c_report.json
            /tmp/p1_independent_b02c_report.json
          retention-days: 30


  b02c-aggregate:
    needs: b02c-transition
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download B02-C matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p1-b02c-*-${{ github.sha }}
          path: /tmp/b02c-artifacts
          merge-multiple: false

      - name: Aggregate transition coverage
        run: |
          python tools/p1_aggregate_b02c_reports.py \
            /tmp/b02c-artifacts \
            --report /tmp/p1_b02c_aggregate.json \
            --require-full-decadal-coverage
          cat /tmp/p1_b02c_aggregate.json

      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: p1-b02c-aggregate-${{ github.sha }}
          path: /tmp/p1_b02c_aggregate.json
          retention-days: 30
