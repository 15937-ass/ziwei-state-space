parallel_work_policy:
  - "Every product session reads top-level PROJECT_STATE.yaml first for repository/knowledge state."
  - "Then read product/PRODUCT_STATE.yaml for the product work-unit pointer."
  - "Knowledge-side corpus progress remains owned by top-level PROJECT_STATE.yaml."
  - "Product feature PRs should avoid editing top-level PROJECT_STATE.yaml unless a coordinated state-sync commit is explicitly needed."
  - "This separation exists to prevent routine knowledge checkpoints and product engineering from repeatedly conflicting on the same state file."
