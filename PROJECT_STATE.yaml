execution_policy:
  - "Every agent/session must read PROJECT_STATE.yaml before selecting a branch, gate, or next task."
  - "Do not infer current state from old chat messages, legacy PRs, or branch names."
  - "Raw canonical extraction remains provenance-preserving; semantic repairs use auditable sidecars."
  - "History memory is typed: ACQUIRED_DISPOSITION and PATH_DEPENDENT_GATE must not be conflated."
  - "Only source-explicit persistence/path-dependence may update history memory."
  - "No persistence duration, decay, continuous weight, or learning parameter may be invented."
  - "ZZ-SYS-38-034 remains quarantined; System-38 history uses source-supported ZZ-SYS-38-021."
  - "P1 layer-boundary audit is closed at 800/800; do not reopen reviewed batches unless a new source conflict or schema defect is identified."
  - "User-facing source-review reporting cadence is now 200 items by explicit user approval on 2026-09-29; persist an internal recoverable GitHub checkpoint every 100 reviewed items."
  - "Hard ceiling is 100 source-review items per PR unless the work is purely mechanical and explicitly approved in advance."
  - "For the approved 200-item reporting cadence, two sequential 100-item internal checkpoints/PRs may be completed before the user-facing report, but each 100-item checkpoint must be independently recoverable and pass CI before the next begins."
  - "After a chat/tool timeout, inspect GitHub commit/PR/workflow state before retrying; never replay completed source review solely because the conversation timed out."
  - "Escalate a new human Gate only if source review requires natal-essence rewrite, multi-palace long-memory propagation, a second independent time scale, or default decay/forgetting dynamics."

source_corpus_policy:
  source_corpus_location: "ChatGPT Project files / approved source corpus"
  github_role: "Canonical derived research state, schemas, rules, code, validation, provenance pointers"
  note: "GitHub does not contain copyrighted source PDFs by default; source-span re-verification requires the approved Project corpus."
