    conditional_signature:
      - {dimension_id: "QI-07", tendency: "昌曲、龙凤等可增强认知/灵巧修饰", condition_class: "modifier", evidence_rules: [ZZ-ZW-017, ZZ-ZW-024], evidence_tier: "SAME_STAR_MODIFIER"}
      - {dimension_id: "QR-01", tendency: "失去支持时可转孤立主导", condition_class: "support_gate", evidence_rules: [ZZ-ZW-X01, ZZ-ZW-X05], evidence_tier: "DIRECT_STAR"}
    contextual_sensitivity:
      level: "very_high"
      explanation: "紫微性质高度依赖同度、会合与百官朝拱；A1 不把支持资源结果直接写成 intrinsic。"
