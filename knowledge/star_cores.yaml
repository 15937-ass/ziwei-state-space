version: "0.2"
status: "A1-G3R-refit"
ontology_version: "0.3"
normalization_epistemic: "INFERRED"
review_status: "MODEL_SELF_REVIEWED"

principle: >
  Gate A1 后，十四正曜气核只记录 direct-star source 中跨场景仍可辨识的 baseline 倾向。
  modifier、四化、夹宫与六十星系材料进入 conditional_signature / interaction 层；
  outcome_descriptor 不作为等权 intrinsic evidence。允许某颗星没有某个 QI，不为适配 ontology 强填维度。

evidence_priority:
  - tier: DIRECT_STAR
    priority: 1
    use: "intrinsic / relational baseline"
  - tier: SAME_STAR_MODIFIER
    priority: 2
    use: "conditional signature"
  - tier: SYSTEM_CONTEXT
    priority: 3
    use: "interaction_delta / mode evidence; normally not intrinsic"
  - tier: PROJECTION
    priority: 4
    use: "downstream support only"

representation:
  substrate:
    fields: [yin_yang, element]
    note: "仅作 L0 结构标签，不数值化。"
  intrinsic_signature:
    fields: [dimension_id, tendency, strength_class, evidence_rules, evidence_tier]
    strength_class: [core, secondary]
  relational_signature:
    fields: [relation_id, tendency, strength_class, evidence_rules, evidence_tier]
  conditional_signature:
    fields: [dimension_id, tendency, condition_class, evidence_rules, evidence_tier]
    note: "条件修正不等同 baseline core。"
  contextual_sensitivity:
    fields: [level, explanation]

stars:
