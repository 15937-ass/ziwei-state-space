G3R_audit:
  removed_cross_subject_intrinsic_evidence:
    - {star: "天府", removed: [ZZ-WQ-020, ZZ-WQ-021], reason: "subject=武曲，仅可说明交互调节"}
    - {star: "太阴", removed: [ZZ-WQ-003], reason: "subject=武曲，不能作为太阴 intrinsic 直接证据"}
  removed_or_demoted_system_context_core_evidence:
    - {star: "廉贞", dimension: "QI-11", examples: [ZZ-LZ-008, ZZ-LZ-009, ZZ-LZ-010]}
    - {star: "贪狼", dimension: "QI-09", examples: [ZZ-TL-003, ZZ-TL-004, ZZ-TL-005]}
    - {star: "天相", dimension: "QI-15", examples: [ZZ-TX-003, ZZ-TX-009]}
  quarantined_evidence:
    - {rule_id: "ZZ-TT-010", reason: "P1 source mismatch confirmed"}

G3R_approval_record:
  approved_by: "PI"
  gate: "A1"
  freeze:
    - "L0 substrate + intrinsic + relational + conditional/context structure"
    - "direct-star > modifier > system-context > projection evidence priority"
    - "禁止为适配 ontology 强填气核"
    - "system-context 不自动升格为 intrinsic"
  provisional:
    - "每颗星具体 QI/QR 映射"
    - "strength_class 的最终分级"
    - "未来经验权重与数值参数"
