schema_version: 2
lane: "KNOWLEDGE_ONLY"
authoritative_execution: "GITHUB_ISSUE"
canonical_branch: "main"

execution:
  mode: "PALACE_SHARDED_V1"
  coordinator_role: "RECOVERY_INDEX_NOT_WORKSPACE"
  contract: "governance/KNOWLEDGE_SHARD_EXECUTION_v1.md"
  registry: "governance/KNOWLEDGE_SHARDS.json"
  core_wip_limit: 1
  max_active_palace_workers: 4
  per_palace_wip_limit: 1
  canonical_merge_policy: "SERIAL_EXACT_HEAD"
  legacy_grandfather_branch: null
  core_continuation_plan: "governance/CORE_PRODUCT_CONTINUATION_PLAN_v1.md"
  core_plan_pointer_issue: 901
  core_next_issue: 898

states:
  core: "knowledge/states/CORE_STATE.yaml"
  P01: "knowledge/states/P01_LIFE_STATE.yaml"
  P02: "knowledge/states/P02_SIBLINGS_STATE.yaml"
  P03: "knowledge/states/P03_SPOUSE_STATE.yaml"
  P04: "knowledge/states/P04_CHILDREN_STATE.yaml"
  P05: "knowledge/states/P05_WEALTH_STATE.yaml"
  P06: "knowledge/states/P06_HEALTH_STATE.yaml"
  P07: "knowledge/states/P07_MIGRATION_STATE.yaml"
  P08: "knowledge/states/P08_FRIENDS_STATE.yaml"
  P09: "knowledge/states/P09_CAREER_STATE.yaml"
  P10: "knowledge/states/P10_PROPERTY_STATE.yaml"
  P11: "knowledge/states/P11_FORTUNE_STATE.yaml"
  P12: "knowledge/states/P12_PARENTS_STATE.yaml"

recovery:
  - "Read PROJECT_STATE.yaml and governance/RECOVERY_PRECEDENCE_v1.md."
  - "Select CORE or exactly one palace shard for this conversation."
  - "Read the corresponding state file above as a cache."
  - "Query live GitHub Issues for KNOWLEDGE_ONLY and the selected shard."
  - "Live Issue/linked PR overrides stale state."
  - "For CORE with no ACTIVE bounded unit, read core plan pointer #901 and admit the earliest eligible nominee; current first nominee is #898."
  - "Do not infer another palace's work from chat history."
  - "Do not use archived twelve-palace candidate material as canonical truth."

current_known_live_work: {}

human_gate:
  pending_on_main: null
  future_branch_gate: "HG-WP06B-MANIFESTATION-ROOT-01"
  response_semantics_gate: "HG-KB-RESPONSE-SEMANTICS-01_APPROVED_BOUNDED_SCHEMA_ONLY"
  note: "Historical/future gates are not current PI requests unless a live shard Issue names them."

integrity:
  source_truth_not_modified_by_empirical_feedback: true
  unresolved_conflicts_preserved: true
  no_invented_numeric_weights: true
  shared_semantics_core_only: true
  cross_palace_unmerged_branch_dependency_forbidden: true

migration:
  from_monolithic_state: true
  migrated_by_issue: 530
  completed_history_source: "Git history / Issues / PRs; intentionally not duplicated here."
