version: 0.3
status: active

# Modifier operator schema
# Engineering normalization for WP04 operator catalogs.
# This update does not change the frozen qi ontology; it aligns the enum
# with operator classes already used by reviewed auxiliary/malefic rules.

fields:
  operator_id:
    type: string
  source_work:
    type: string
  source_location:
    type: string
  subject:
    description: star, star-system, modifier, or contextual structure receiving the operation
  condition:
    description: triggering condition
  operator_type:
    allowed:
      - enhance
      - weaken
      - transform
      - inhibit
      - activate
      - conditional
      - projection
      - structural_relation
      - pair_interaction
      - gate
    semantics:
      enhance: "increase or strengthen an existing state/component"
      weaken: "decrease or attenuate an existing state/component"
      transform: "change mode/direction rather than merely scale magnitude"
      inhibit: "suppress activation or transition"
      activate: "trigger or raise activation of a state/path"
      conditional: "effect branches on context and cannot be assigned a single direction"
      projection: "map an internal/system state to a palace or observable semantic output"
      structural_relation: "define a relation/taxonomy/pairing rather than a state increment"
      pair_interaction: "interaction term requiring two or more modifiers"
      gate: "condition that enables, blocks, or attenuates another effect"
  target_dimension:
    description: >
      latent dimension, local/system state, relation state, or L3 projection affected.
      Downstream event labels must be explicitly marked as projection rather than primitive qi.
  direction:
    allowed:
      - positive
      - negative
      - mixed
      - nonlinear
      - unknown
      - not_applicable
  source_epistemic:
    allowed:
      - EXPLICIT
      - INFERRED_FROM_SOURCE
      - UNRESOLVED_SOURCE
  normalization_epistemic:
    allowed:
      - SOURCE_PRESERVING
      - INFERRED
      - IMPLEMENTATION
      - HYPOTHESIS
      - UNRESOLVED
  review_status:
    allowed:
      - MODEL_EXTRACTED
      - MODEL_SELF_REVIEWED
      - SOURCE_SPAN_VERIFIED
      - HUMAN_VERIFIED
  reviewer_type:
    type: string
  reviewer_id:
    type: string
  reviewed_at:
    type: string
  source_span_verified:
    allowed:
      - "true"
      - "false"
  normalization_verified:
    allowed:
      - "true"
      - "false"
  normalization_rationale:
    type: string
  epistemic_type:
    description: "legacy compatibility field; do not use as v0.3 verification proof"
  evidence_text:
    type: string
  confidence:
    type: string

normalization_rules:
  - "No operator is globally favorable/unfavorable independent of subject and context."
  - "化禄/化权/化科/化忌 are not assigned universal scalar gains."
  - "A source-stated outcome may be retained as L3 projection but must not be promoted to primitive qi."
  - "Subject-specific states may be used provisionally without changing G2 ontology."
  - "New primitive qi requires a human gate; local/system states do not."
